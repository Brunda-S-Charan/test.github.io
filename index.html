<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KrishiConnect - Farmer Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6f2ff; /* light blue background */
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #3399ff;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #0066cc;
    }
    label {
      font-weight: bold;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #3399ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background-color: #267acc;
    }
  </style>
</head>
<body>
  <header>
    <h1>KrishiConnect - Farmer Portal</h1>
    <p>Directly connect with buyers, list your crops easily!</p>
  </header>

  <div class="container">
    <h2>Farmer Produce Listing</h2>
    <form>
      <label for="name">Farmer Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">

      <label for="crop">Crop Name:</label>
      <input type="text" id="crop" name="crop" placeholder="E.g., Tomato, Onion">

      <label for="quantity">Quantity (in kg):</label>
      <input type="number" id="quantity" name="quantity">

      <label for="price">Expected Price (₹/kg):</label>
      <input type="number" id="price" name="price">

      <label for="harvest">Harvest Date:</label>
      <input type="date" id="harvest" name="harvest">

      <label for="details">Additional Details:</label>
      <textarea id="details" name="details" rows="4" placeholder="Quality, organic info, etc."></textarea>

      <button type="submit">Submit Listing</button>
    </form>
  </div>
</body>
</html>
